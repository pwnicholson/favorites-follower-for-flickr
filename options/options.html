<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Follow Favorites - Options</title>
  <style>
    body{font-family:Arial;padding:16px}
    label{display:block;margin-top:8px}
    input{width:100%;padding:8px;margin-top:4px}
    button{margin-top:12px;padding:8px 12px}
  </style>
</head>
<body>
  <h2>Flickr API Keys</h2>
  <label>API Key<input id="api_key" placeholder="FLICKR_API_KEY"></label>
  <label>API Secret<input id="api_secret" placeholder="FLICKR_API_SECRET"></label>
  <button id="save">Save</button>
  <button id="clearTokens">Clear OAuth Tokens</button>
  <div id="status" style="margin-top:12px"></div>

  <script src="options.js"></script>
</body>
</html>
