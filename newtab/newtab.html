<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Flickr Favorites Feed</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <header>
    <div id="authBanner" class="banner hidden">
      <span>Please authorize with Flickr to enable private features.</span>
      <button id="authBtn">Authorize with Flickr</button>
    </div>
    <div class="controls">
      <label>Size: <select id="sizeSelect"><option value="small">Small</option><option value="medium" selected>Medium</option><option value="large">Large</option></select></label>
      <label>Theme: <select id="themeSelect"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label>SafeSearch: <select id="safeSelect"><option value="all">All</option><option value="safe">Safe Only</option></select></label>
      <label>Sort: <select id="sortSelect"><option value="faved">Date Favorited</option><option value="uploaded">Date Uploaded</option><option value="taken">Date Taken</option></select></label>
      <button id="manageFollowing">Manage Following</button>
    </div>
  </header>

  <main>
    <div id="feed" class="feed"></div>
  </main>

  <footer>
    <button id="prevPage">Previous</button>
    <span id="pageLabel">Page 1 of 1</span>
    <button id="nextPage">Next</button>
  </footer>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3>Following</h3>
      <div id="followingList"></div>
      <button id="closeModal">Close</button>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
